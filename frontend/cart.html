<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ShopVibe</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./css/style.css">
    <style>
        .cart-container { display: flex; flex-wrap: wrap; gap: 20px; margin-top: 20px; }
        .cart-items { flex: 2; min-width: 300px; }
        .cart-summary { flex: 1; min-width: 250px; background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #ddd; height: fit-content; }
        .cart-item { display: flex; align-items: center; justify-content: space-between; padding: 15px; background: #fff; margin-bottom: 15px; border-radius: 8px; border: 1px solid #ddd; }
        .cart-item img { width: 80px; height: 80px; object-fit: cover; border-radius: 4px; }
        .cart-item-details { flex: 1; margin: 0 15px; }
        .qty-select { padding: 5px; margin-right: 15px; }
        .remove-btn { background: #dc3545; padding: 8px 12px; }
        .remove-btn:hover { background: #c82333; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 1.2rem; }
        .checkout-btn { width: 100%; background: #28a745; }
        .checkout-btn:hover { background: #218838; }
    </style>
</head>
<body>
    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">ShopVibe</a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="cart.html">Cart (<span id="cart-count">0</span>)</a></li>
                <li><a href="login.html">Login</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h1>Shopping Cart</h1>
        <div class="cart-container">
            <div id="cart-items" class="cart-items">
                <!-- Cart items injected here -->
            </div>
            <div class="cart-summary">
                <h2>Order Summary</h2>
                <hr style="margin: 10px 0;">
                <div class="summary-row">
                    <span>Subtotal (<span id="summary-qty">0</span> items):</span>
                    <strong id="summary-price">$0.00</strong>
                </div>
                <button class="btn checkout-btn" onclick="proceedToCheckout()">Proceed to Checkout</button>
            </div>
        </div>
    </main>

    <script src="./js/cart.js"></script>
    <script src="./js/navbar.js"></script>
</body>
</html>
